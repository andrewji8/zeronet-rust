name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
